  /emails/send:
    post:
      description: "Accepted with 202 once the message is durably recorded; delivery\
        \ is asynchronous. Honours `Idempotency-Key` (same key → same `id`). Rate\
        \ limit 600/h per organisation. Suppressed recipients (bounces, complaints,\
        \ org opt-outs) are reported per recipient and never handed to the MTA; if\
        \ every `to` is suppressed the message is recorded with `status: suppressed`.\
        \ `category: marketing` → 422 (use campaigns). `from` on an unverified domain\
        \ → 422. A `from` on a verified domain that no sending identity may send as\
        \ → 422 `sender_identity_missing` (nothing recorded). Sendable: the sending\
        \ address of the domain (`<from_local_part>@<domain>`; re-run `/email-domains/{id}/verify`\
        \ if its identity is missing), or a hosted mailbox of the organisation or\
        \ one of its aliases with API sending enabled (Mail settings). Attachments\
        \ over 2 MB decoded → 413. Webhooks: `email.sent`, `email.delivered`, `email.bounced`,\
        \ `email.complained`, `email.suppressed`."
      operationId: createEmailSend
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              to:
              - email: ana@client.ro
                name: Ana Popescu
              subject: Factura 2026-0042
              html: "<p>Bună ziua, atașat găsiți factura.</p>"
              category: transactional
              tags:
              - invoice
              headers:
                X-Entity-Ref-ID: inv_2026_0042
            schema:
              $ref: "#/components/schemas/EmailSendRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEmailSend_202_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Send a transactional or notification email as the organisation (scope:\
        \ emails:send)"
      tags:
      - emails
