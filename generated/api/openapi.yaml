        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Compat shim: cancel an invoice by seriesname + number query params\
        \ (SmartBill-shaped)"
      tags:
      - compat
  /invoices/{id}:
