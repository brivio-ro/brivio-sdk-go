    InvoiceCreate:
      description: "Exactly one of `contact_id` or `contact_external_id` is required.\
        \ Issued documents are numbered by the same gapless per-(company, series,\
        \ year) allocator the app uses (ADR-0208); the `series` defaults to `BRV`.\
        \ Non-RON documents carry the BNR T-1 reference rate for `issue_date` unless\
        \ a positive `exchange_rate` is supplied — when the rate cannot be obtained\
        \ the request fails with 422 `EXCHANGE_RATE_UNAVAILABLE`, never a silent rate\
        \ of 1."
      example:
        contact_external_id: contact_external_id
        notes: notes
        company_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        exchange_rate: 0.8008281904610115
        due_date: 2000-01-23
        vat_exemption_reason: vat_exemption_reason
        type: INVOICE
        contact_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        issue_date: 2000-01-23
        project_id: project_id
        series: series
        currency: RON
        vat_type: TAXABLE
        items:
        - article_id: article_id
          unit: buc
          quantity: 6.027456183070403
          description: description
          unit_price: 1.4658129805029452
          vat_rate: 5.962133916683182
        - article_id: article_id
          unit: buc
          quantity: 6.027456183070403
          description: description
          unit_price: 1.4658129805029452
          vat_rate: 5.962133916683182
        direction: ISSUED
      properties:
        type:
          enum:
          - INVOICE
          - PROFORMA
          - QUOTE
          - RECEIPT
          - CREDIT_NOTE
          type: string
        direction:
          default: ISSUED
          enum:
          - ISSUED
          - RECEIVED
          type: string
        series:
          description: Numbering series; defaults to `BRV` for issued documents.
          type: string
        contact_id:
          format: uuid
          type: string
        contact_external_id:
          description: "Your own identifier for the contact, resolved through the\
            \ external reference map (source `api`, entity `contact`). Used only when\
            \ `contact_id` is absent; unknown → 404 `CONTACT_NOT_FOUND`."
          maxLength: 255
          type: string
        company_id:
          description: Issuing legal entity. Optional when the organization has a
            single active company; required (422) when it has several.
          format: uuid
          type: string
        project_id:
          type: string
        issue_date:
          format: date
          type: string
        due_date:
          format: date
          type: string
        currency:
          default: RON
          type: string
        exchange_rate:
          description: RON per 1 unit of `currency`. Omit to have the BNR T-1 reference
            rate fetched server-side (recommended). A supplied value is persisted
            as-is; ignored for RON.
          type: number
        vat_type:
          description: "VAT regime of the document. When omitted it is derived from\
            \ the contact: RO → TAXABLE; EU (non-RO) with a VAT number → INTRA_COMMUNITY\
            \ (reverse charge, UBL category AE); EU without VAT number → TAXABLE;\
            \ non-EU → EXPORT. Only TAXABLE carries line VAT."
          enum:
          - TAXABLE
          - REVERSE_CHARGE
          - INTRA_COMMUNITY
          - EXPORT
          - VAT_EXEMPT
          - NON_TAXABLE
          - MARGIN
          type: string
        vat_exemption_reason:
          description: Legal mention printed and emitted for non-TAXABLE regimes.
          maxLength: 500
          type: string
        notes:
          type: string
        items:
          items:
            $ref: "#/components/schemas/InvoiceCreate_items_inner"
          type: array
      required:
      - due_date
      - issue_date
      - items
