          description: Error
      summary: Get a contact
      tags:
      - contacts
    patch:
      operationId: updateContact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
