  /companies/search:
    get:
      description: "Prospectare: filter ~2M Romanian companies. Same query-string\
        \ codec as the /prospecting web UI (e.g. ?jud=CLUJ&sect=62&fin=employees:latest:10-).\
        \ Scope: companies:read."
      operationId: listCompanySearch
      parameters:
      - description: Free text (name/CUI)
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: "CAEN codes, comma-separated"
        explode: true
        in: query
        name: caen
        required: false
        schema:
          type: string
        style: form
      - description: "CAEN divisions, comma-separated"
        explode: true
        in: query
        name: sect
        required: false
        schema:
          type: string
        style: form
      - description: "Counties, comma-separated"
        explode: true
        in: query
        name: jud
        required: false
        schema:
          type: string
        style: form
      - description: "Financial ranges, e.g. revenue:latest:1000000-"
        explode: true
        in: query
        name: fin
        required: false
        schema:
          type: string
        style: form
      - description: "Trend filters, e.g. profitableYears:3"
        explode: true
        in: query
        name: trend
        required: false
        schema:
          type: string
        style: form
      - description: Administrator/associate name
        explode: true
        in: query
        name: adm
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - relevance
          - name
          - nameDesc
          - revenue
          - revenueAsc
          - employees
          - employeesAsc
          - foundedNewest
          - foundedOldest
          type: string
        style: form
      - description: Page
        explode: true
        in: query
        name: p
        required: false
        schema:
          type: integer
        style: form
      - description: Page size (max 200)
        explode: true
        in: query
        name: "n"
        required: false
        schema:
          type: integer
        style: form
      - description: Include aggregate stats
        explode: true
        in: query
        name: stats
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Search the public company registry (compact URL filters)
      tags:
      - companies
    post:
      description: "Body: { groups: FilterGroup[], sort?, page?, pageSize?, stats?\
        \ }. AND between groups, OR within a group; groups support exclude:true (NOT).\
        \ Scope: companies:read."
      operationId: createCompanySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createCompanySearch_request"
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Search the public company registry (full filter model)
      tags:
      - companies
