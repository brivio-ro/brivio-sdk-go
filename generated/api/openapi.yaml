  /email/send:
    post:
      description: "Same pipeline as `/emails/send` (verified sender domain, fail-closed\
        \ suppression, Safe Mode, outbox retry, `email.*` webhooks) with a flatter\
        \ wire shape: addresses are strings (`\"Ana <ana@x.ro>\"`), `tags` is a key→\
        value map, custom headers are allowed except envelope/MIME/authentication\
        \ ones (From, To, Cc, Bcc, Subject, Reply-To, Message-ID, Date, Content-Type,\
        \ DKIM-Signature, ARC-*, …; no CR/LF). `category` defaults to `transactional`;\
        \ `auth` and `alert` are aliases for `transactional` and `notification`; `marketing`\
        \ → 422. `from` on an unverified domain → 422 `from_domain_not_verified`;\
        \ omit it for the org default sender. A `from` that no sending identity may\
        \ send as → 422 `sender_identity_missing` (nothing recorded): use the sending\
        \ address of the domain, or a hosted mailbox / alias with API sending enabled.\
        \ 202 whenever the message is recorded — `status` is `sent`, `queued` (including\
        \ a transport failure parked for retry) or `suppressed` (non-error). A transport\
        \ refusal that could not be queued → 502 `send_failed`. `id`, `status` and\
        \ `suppressed` are mirrored at the top level of the 202 body for clients that\
        \ read them there. Honours `Idempotency-Key`. Shares the 600/h per-organisation\
        \ limit with `/emails/send`."
      operationId: sendEmailMessage
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              from: codai <no-reply@mail.codai.ro>
              to:
              - ana@client.ro
              subject: Your sign-in code
              text: "Code: 481 220"
              category: transactional
              tags:
                kind: auth_email
              headers:
                X-Entity-Ref-ID: auth-8f2c
            schema:
              $ref: "#/components/schemas/EmailMessageSendRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessageAccepted"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Send transactional mail from a sibling application, RFC 5322 address\
        \ strings (scope: emails:send)"
      tags:
      - email
