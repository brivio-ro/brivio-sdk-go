      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Compat shim: create an invoice with an Oblio-shaped payload (Oblio\
        \ POST /api/docs/invoice)"
      tags:
      - compat
  /compat/oblio/docs/invoice/cancel:
    put:
      operationId: cancelOblioCompatInvoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
