openapi: 3.1.0
info:
  description: "Public REST API for Brivio — invoicing, contacts, articles, locations\
    \ and module entitlements. Authenticate with a Bearer API key (brivio_sk_live_…\
    \ / brivio_sk_test_…)."
  title: Brivio API
  version: 1.0.0
servers:
- url: https://api.brivio.ro/v1
security:
- bearerAuth: []
paths:
  /me:
    get:
      operationId: listMe
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Identify the authenticated organization
      tags:
      - me
  /contacts:
    get:
      operationId: listContacts
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: perPage
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listContacts_200_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: List contacts
      tags:
      - contacts
    post:
      operationId: createContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createContact_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Create a contact
      tags:
      - contacts
  /contacts/{id}:
    delete:
      operationId: deleteContact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Delete a contact
      tags:
      - contacts
    get:
      operationId: getContact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createContact_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Get a contact
      tags:
      - contacts
    patch:
      operationId: updateContact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createContact_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Update a contact
      tags:
      - contacts
  /companies/lookup:
    get:
      description: "Auto-fill Persoană Juridică billing details from a CUI. Returns\
        \ an empty result list rather than 404 when nothing matches. Scope: contacts:read."
      operationId: listCompanyLookup
      parameters:
      - description: The CUI to look up
        explode: true
        in: query
        name: cui
        required: false
        schema:
          type: string
        style: form
      - description: Alias for cui
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Look up a company by CUI (scope: contacts:read)"
      tags:
      - companies
  /companies/search:
    get:
      description: "Prospectare: filter ~2M Romanian companies. Same query-string\
        \ codec as the /prospecting web UI (e.g. ?jud=CLUJ&sect=62&fin=employees:latest:10-).\
        \ Scope: companies:read."
      operationId: listCompanySearch
      parameters:
      - description: Free text (name/CUI)
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: "CAEN codes, comma-separated"
        explode: true
        in: query
        name: caen
        required: false
        schema:
          type: string
        style: form
      - description: "CAEN divisions, comma-separated"
        explode: true
        in: query
        name: sect
        required: false
        schema:
          type: string
        style: form
      - description: "Counties, comma-separated"
        explode: true
        in: query
        name: jud
        required: false
        schema:
          type: string
        style: form
      - description: "Financial ranges, e.g. revenue:latest:1000000-"
        explode: true
        in: query
        name: fin
        required: false
        schema:
          type: string
        style: form
      - description: "Trend filters, e.g. profitableYears:3"
        explode: true
        in: query
        name: trend
        required: false
        schema:
          type: string
        style: form
      - description: Administrator/associate name
        explode: true
        in: query
        name: adm
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - relevance
          - name
          - nameDesc
          - revenue
          - revenueAsc
          - employees
          - employeesAsc
          - foundedNewest
          - foundedOldest
          type: string
        style: form
      - description: Page
        explode: true
        in: query
        name: p
        required: false
        schema:
          type: integer
        style: form
      - description: Page size (max 200)
        explode: true
        in: query
        name: "n"
        required: false
        schema:
          type: integer
        style: form
      - description: Include aggregate stats
        explode: true
        in: query
        name: stats
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Search the public company registry (compact URL filters)
      tags:
      - companies
    post:
      description: "Body: { groups: FilterGroup[], sort?, page?, pageSize?, stats?\
        \ }. AND between groups, OR within a group; groups support exclude:true (NOT).\
        \ Scope: companies:read."
      operationId: createCompanySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createCompanySearch_request"
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Search the public company registry (full filter model)
      tags:
      - companies
  /companies/{cui}/similar:
    get:
      operationId: listCompanySimilar
      parameters:
      - explode: false
        in: path
        name: cui
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          maximum: 25
          type: integer
        style: form
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Find similar companies (same CAEN, county, size band)"
      tags:
      - companies
  /articles:
    get:
      operationId: listArticles
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: perPage
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listArticles_200_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: List articles
      tags:
      - articles
    post:
      operationId: createArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createArticle_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Create an article
      tags:
      - articles
  /articles/sync:
    post:
      operationId: createArticleSync
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Upsert articles by external_id (idempotent bulk sync, ADR-0212; scope:\
        \ articles:write)"
      tags:
      - articles
  /articles/{id}:
    delete:
      operationId: deleteArticle
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Delete a article
      tags:
      - articles
    get:
      operationId: getArticle
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createArticle_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Get a article
      tags:
      - articles
    patch:
      operationId: updateArticle
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createArticle_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Update a article
      tags:
      - articles
  /articles/{id}/prices:
    get:
      operationId: listArticlePrices
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "List an article's prices (scope: articles:read)"
      tags:
      - articles
    post:
      operationId: createArticlePrice
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Add a price (one_time | month | year | metered) to an article (scope:\
        \ articles:write)"
      tags:
      - articles
  /articles/{id}/components:
    get:
      operationId: listArticleComponents
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "List a bundle's components (ADR-0225; scope: articles:read)"
      tags:
      - articles
    put:
      operationId: updateArticleComponent
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateArticleComponent_request"
        required: true
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Replace a bundle's components — no nesting, no duplicates (ADR-0225;\
        \ scope: articles:write)"
      tags:
      - articles
  /articles/{id}/prices/sync:
    post:
      operationId: createArticlePriceSync
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: "Push the article's active prices to the org's Stripe account (metered\
        \ prices get a Billing Meter; scope: articles:write)"
      tags:
      - articles
  /invoices:
    get:
      operationId: listInvoices
      parameters:
      - explode: true
        in: query
        name: page
