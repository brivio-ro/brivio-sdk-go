openapi: 3.1.0
info:
  description: "Public REST API for Brivio — invoicing, contacts, articles, locations\
    \ and module entitlements. Authenticate with a Bearer API key (brivio_sk_live_…\
    \ / brivio_sk_test_…)."
  title: Brivio API
  version: 1.0.0
servers:
- url: https://api.brivio.ro/v1
security:
- bearerAuth: []
paths:
  /me:
    get:
      operationId: listMe
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Identify the authenticated organization
      tags:
      - me
  /contacts:
    get:
      operationId: listContacts
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: perPage
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listContacts_200_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: List contacts
      tags:
      - contacts
    post:
      operationId: createContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createContact_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Create a contact
      tags:
      - contacts
  /contacts/{id}:
    delete:
      operationId: deleteContact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
