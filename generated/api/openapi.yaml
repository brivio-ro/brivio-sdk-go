            Cache-Control:
              description: "`private, no-cache` — keep the body, revalidate with If-None-Match."
              explode: false
              schema:
                type: string
              style: simple
        "304":
          description: Not Modified — the If-None-Match ETag is current; empty body.
          headers:
            ETag:
              description: "Strong validator of the JSON body; per transfer encoding\
                \ (`\"<hash>\"`, `\"<hash>-br\"`, `\"<hash>-gzip\"`). Any of them\
                \ matches If-None-Match."
              explode: false
              schema:
                type: string
              style: simple
            Cache-Control:
              description: "`private, no-cache` — keep the body, revalidate with If-None-Match."
              explode: false
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
