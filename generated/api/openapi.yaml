        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Delete a invoice
      tags:
      - invoices
    get:
      operationId: getInvoice
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInvoice_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: Get a invoice
      tags:
      - invoices
    patch:
      operationId: updateInvoice
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInvoice_201_response"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
