      summary: List line items of an invoice
      tags:
      - invoices
  /invoices/{id}/payments:
    get:
      operationId: listInvoicePayments
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMe_401_response"
          description: Error
      summary: List payments recorded against an invoice
      tags:
