components:
  schemas:
    Meta:
      example:
        nextCursor: nextCursor
        total: 1
        perPage: 6
        totalPages: 5
        page: 0
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        nextCursor:
          type: string
          nullable: true
    Error:
      properties:
        data:
          nullable: true
        error:
          $ref: "#/components/schemas/listMe_401_response_error"
      required:
      - data
      - error
    BankRuleInput:
      description: "A bank reconciliation rule. At least one condition (matchCounterpartyName,\
        \ matchCounterpartyIban, matchDescription/Regex, amountMin/Max, direction\
        \ != any) and one action (assignContactId, assignAccountId, assignCostCenterId,\
        \ assignVatRate, descriptionTemplate, markIgnored, memo) are required."
      example:
        stagingMode: recognized
        amountMax: amountMax
        assignAccountId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        descriptionTemplate: descriptionTemplate
        matchDescriptionRegex: matchDescriptionRegex
        matchDescription: matchDescription
        assignVatRate: 8
        memo: memo
        isActive: true
        assignContactId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        matchDescriptionOp: contains
        markIgnored: false
        amountMin: amountMin
        matchCounterpartyIban: matchCounterpartyIban
        name: name
        assignCostCenterId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        matchCounterpartyName: matchCounterpartyName
        direction: any
      properties:
        name:
          maxLength: 200
          type: string
        isActive:
          default: true
          type: boolean
        stagingMode:
          default: recognized
          enum:
          - recognized
          - categorized
          type: string
        matchCounterpartyName:
          maxLength: 255
          type: string
          nullable: true
        matchCounterpartyIban:
          maxLength: 40
          type: string
          nullable: true
        matchDescriptionRegex:
          maxLength: 500
          type: string
          nullable: true
        matchDescription:
          maxLength: 500
          type: string
          nullable: true
        matchDescriptionOp:
          default: contains
          enum:
          - contains
          - starts_with
          - equals
          - regex
          type: string
        amountMin:
          description: "Decimal, up to 2 dp"
          type: string
          nullable: true
        amountMax:
          description: "Decimal, up to 2 dp"
          type: string
          nullable: true
        direction:
          default: any
          enum:
          - any
          - inflow
          - outflow
          type: string
        assignContactId:
          format: uuid
          type: string
          nullable: true
        assignAccountId:
          format: uuid
          type: string
          nullable: true
        assignCostCenterId:
          format: uuid
          type: string
          nullable: true
        assignVatRate:
          maximum: 100
          minimum: 0
          type: integer
          nullable: true
        descriptionTemplate:
          maxLength: 500
          type: string
          nullable: true
        markIgnored:
          default: false
          type: boolean
        memo:
          maxLength: 2000
          type: string
          nullable: true
    Contact:
      example:
        is_active: true
        phone: phone
        person_type: INDIVIDUAL
        vat_number: vat_number
        name: name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        type: CLIENT
        email: email
      properties:
        id:
          format: uuid
          type: string
        type:
          enum:
          - CLIENT
          - SUPPLIER
          - BOTH
          type: string
        person_type:
          enum:
          - INDIVIDUAL
          - COMPANY
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        vat_number:
          type: string
          nullable: true
        is_active:
          type: boolean
    ContactCreate:
      example:
        person_type: INDIVIDUAL
        vat_number: vat_number
        name: name
        type: CLIENT
        email: email
      properties:
        type:
          enum:
          - CLIENT
